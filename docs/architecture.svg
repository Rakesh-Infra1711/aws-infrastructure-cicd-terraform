<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="770" viewBox="0 0 1100 770" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#37474F"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1565C0"/>
    </marker>
    <style>
      .t  { font-size: 12px; fill: #1d1d1f; }
      .ts { font-size: 10.5px; fill: #37474F; }
      .tb { font-size: 12.5px; font-weight: bold; fill: #1d1d1f; }
      .lbl{ font-size: 10.5px; fill: #1565C0; font-weight: bold; }
      .res{ fill: #ffffff; stroke: #455A64; stroke-width: 1.3; rx: 6; }
      .flow { stroke: #37474F; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
      .flowb{ stroke: #1565C0; stroke-width: 1.6; fill: none; marker-end: url(#arrowBlue); stroke-dasharray: 5 4; }
    </style>
  </defs>

  <rect width="1100" height="770" fill="#ffffff"/>

  <!-- ===== Title + CI/CD column ===== -->
  <text x="20" y="30" font-size="17" font-weight="bold" fill="#1F4E79">AWS Infrastructure &amp; CI/CD</text>
  <text x="20" y="48" class="ts">Terraform-managed, HA across 2 AZs</text>

  <rect x="20" y="80" width="215" height="165" class="res" style="stroke:#24292F"/>
  <text x="32" y="102" class="tb">GitHub</text>
  <text x="32" y="122" class="t">Repository: app + Terraform</text>
  <text x="32" y="146" class="tb">GitHub Actions</text>
  <text x="32" y="164" class="ts">1. App unit tests (pytest)</text>
  <text x="32" y="180" class="ts">2. fmt · validate · terraform test</text>
  <text x="32" y="196" class="ts">3. plan on pull request</text>
  <text x="32" y="212" class="ts">4. apply on merge to main</text>
  <text x="32" y="228" class="ts">5. rolling refresh + health check</text>

  <rect x="20" y="275" width="215" height="58" class="res"/>
  <text x="32" y="297" class="tb">IAM OIDC role</text>
  <text x="32" y="315" class="ts">Short-lived credentials, no access keys</text>

  <rect x="20" y="360" width="215" height="72" class="res"/>
  <text x="32" y="382" class="tb">S3 Terraform state</text>
  <text x="32" y="400" class="ts">Versioned · KMS encrypted</text>
  <text x="32" y="416" class="ts">S3-native state locking</text>

  <path d="M127,245 L127,275" class="flow"/>
  <path d="M127,333 L127,360" class="flow"/>
  <path d="M235,304 L268,304" class="flow"/>

  <!-- ===== Users / DNS ===== -->
  <rect x="520" y="6" width="150" height="40" class="res" style="stroke:#1F4E79"/>
  <text x="545" y="31" class="tb">Users (Internet)</text>
  <rect x="700" y="6" width="380" height="40" class="res"/>
  <text x="712" y="23" class="tb">DNS + ACM</text>
  <text x="712" y="39" class="ts">app domain → ALB (Route 53 alias or CNAME) · public TLS certificate</text>

  <!-- ===== AWS cloud ===== -->
  <rect x="250" y="60" width="840" height="700" fill="none" stroke="#FF9900" stroke-width="2" rx="8"/>
  <text x="262" y="78" font-size="12" font-weight="bold" fill="#E65100">AWS Cloud · ap-south-1 (Mumbai)</text>

  <!-- VPC -->
  <rect x="268" y="96" width="590" height="650" fill="none" stroke="#2E7D32" stroke-width="2" rx="8"/>
  <text x="280" y="114" font-size="12" font-weight="bold" fill="#2E7D32">VPC 10.20.0.0/16</text>

  <!-- IGW -->
  <rect x="510" y="84" width="120" height="26" fill="#FFF3E0" stroke="#E65100" rx="5"/>
  <text x="523" y="101" class="t">Internet Gateway</text>

  <!-- AZ columns -->
  <rect x="284" y="124" width="276" height="510" fill="none" stroke="#90A4AE" stroke-dasharray="6 4" rx="6"/>
  <text x="294" y="140" class="ts" font-weight="bold">Availability Zone A</text>
  <rect x="572" y="124" width="276" height="510" fill="none" stroke="#90A4AE" stroke-dasharray="6 4" rx="6"/>
  <text x="582" y="140" class="ts" font-weight="bold">Availability Zone B</text>

  <!-- Public subnets -->
  <rect x="292" y="148" width="260" height="128" fill="#E8F5E9" stroke="#66BB6A" rx="5"/>
  <text x="300" y="164" class="ts">Public subnet 10.20.0.0/24</text>
  <rect x="580" y="148" width="260" height="128" fill="#E8F5E9" stroke="#66BB6A" rx="5"/>
  <text x="588" y="164" class="ts">Public subnet 10.20.1.0/24</text>

  <rect x="310" y="172" width="520" height="42" class="res" style="stroke:#8E24AA;stroke-width:1.8"/>
  <text x="322" y="190" class="tb">Application Load Balancer</text>
  <text x="322" y="206" class="ts">HTTPS 443 (TLS 1.2+/1.3, ACM) · HTTP 80 → 301 HTTPS · health check /health</text>

  <rect x="300" y="226" width="150" height="42" class="res"/>
  <text x="312" y="244" class="tb">NAT Gateway</text>
  <text x="312" y="260" class="ts">outbound only</text>

  <!-- App subnets -->
  <rect x="292" y="296" width="260" height="164" fill="#E3F2FD" stroke="#42A5F5" rx="5"/>
  <text x="300" y="312" class="ts">Private app subnet 10.20.10.0/24</text>
  <rect x="580" y="296" width="260" height="164" fill="#E3F2FD" stroke="#42A5F5" rx="5"/>
  <text x="588" y="312" class="ts">Private app subnet 10.20.11.0/24</text>

  <rect x="304" y="320" width="526" height="132" fill="none" stroke="#E65100" stroke-dasharray="7 4" rx="6"/>
  <text x="314" y="336" class="ts" fill="#E65100" font-weight="bold">Auto Scaling Group · min 2 / max 4 · CPU target 60% · rolling instance refresh</text>

  <rect x="330" y="350" width="170" height="86" class="res"/>
  <text x="342" y="370" class="tb">EC2 (app :8080)</text>
  <text x="342" y="388" class="ts">Amazon Linux 2023</text>
  <text x="342" y="403" class="ts">IMDSv2 · encrypted EBS</text>
  <text x="342" y="418" class="ts">no SSH (SSM only)</text>

  <rect x="630" y="350" width="170" height="86" class="res"/>
  <text x="642" y="370" class="tb">EC2 (app :8080)</text>
  <text x="642" y="388" class="ts">Launch Template</text>
  <text x="642" y="403" class="ts">gunicorn + Flask</text>
  <text x="642" y="418" class="ts">instance role (least priv.)</text>

  <!-- DB subnets -->
  <rect x="292" y="480" width="260" height="146" fill="#EDE7F6" stroke="#7E57C2" rx="5"/>
  <text x="300" y="496" class="ts">Private DB subnet 10.20.20.0/24</text>
  <rect x="580" y="480" width="260" height="146" fill="#EDE7F6" stroke="#7E57C2" rx="5"/>
  <text x="588" y="496" class="ts">Private DB subnet 10.20.21.0/24</text>

  <rect x="320" y="512" width="200" height="92" class="res" style="stroke:#5E35B1;stroke-width:1.8"/>
  <text x="332" y="532" class="tb">RDS MySQL 8.4</text>
  <text x="332" y="550" class="ts">encrypted at rest · TLS required</text>
  <text x="332" y="565" class="ts">not publicly accessible</text>
  <text x="332" y="580" class="ts">backups 7 days</text>
  <text x="332" y="595" class="ts">no internet route</text>

  <rect x="620" y="512" width="200" height="92" fill="#ffffff" stroke="#5E35B1" stroke-dasharray="5 4" rx="6"/>
  <text x="632" y="532" class="tb">Standby (Multi-AZ)</text>
  <text x="632" y="550" class="ts">enabled with db_multi_az = true</text>
  <text x="632" y="565" class="ts">automatic failover</text>

  <!-- Bottom of VPC -->
  <rect x="284" y="650" width="276" height="84" class="res"/>
  <text x="296" y="670" class="tb">S3 Gateway Endpoint</text>
  <text x="296" y="688" class="ts">EC2 → S3 privately, no NAT cost</text>

  <rect x="572" y="650" width="276" height="84" class="res"/>
  <text x="584" y="670" class="tb">Security group chain</text>
  <text x="584" y="688" class="ts">ALB-SG: 443/80 from internet</text>
  <text x="584" y="704" class="ts">App-SG: 8080 from ALB-SG only</text>
  <text x="584" y="720" class="ts">DB-SG: 3306 from App-SG only</text>

  <!-- ===== Regional services ===== -->
  <rect x="876" y="110" width="200" height="66" class="res" style="stroke:#2E7D32"/>
  <text x="888" y="130" class="tb">S3 · ALB access logs</text>
  <text x="888" y="148" class="ts">SSE-S3 · private · 90-day expiry</text>

  <rect x="876" y="196" width="200" height="78" class="res" style="stroke:#2E7D32"/>
  <text x="888" y="216" class="tb">S3 · app storage</text>
  <text x="888" y="234" class="ts">app code + uploads</text>
  <text x="888" y="250" class="ts">SSE-KMS · versioned · TLS-only</text>

  <rect x="876" y="330" width="200" height="66" class="res" style="stroke:#C62828"/>
  <text x="888" y="350" class="tb">Secrets Manager</text>
  <text x="888" y="368" class="ts">RDS-managed DB credentials</text>

  <rect x="876" y="420" width="200" height="56" class="res"/>
  <text x="888" y="440" class="tb">SSM Session Manager</text>
  <text x="888" y="458" class="ts">admin access, no SSH keys</text>

  <rect x="876" y="500" width="200" height="66" class="res"/>
  <text x="888" y="520" class="tb">CloudWatch</text>
  <text x="888" y="538" class="ts">EC2 / ALB metrics · RDS logs</text>
  <text x="888" y="554" class="ts">scaling alarms</text>

  <!-- ===== Flows ===== -->
  <path d="M595,46 L585,84" class="flow"/>
  <text x="596" y="70" class="lbl">HTTPS</text>
  <path d="M570,110 L570,172" class="flow"/>
  <path d="M415,214 L415,350" class="flow"/>
  <path d="M715,214 L715,350" class="flow"/>
  <text x="422" y="288" class="lbl">:8080</text>
  <text x="722" y="288" class="lbl">:8080</text>
  <path d="M415,436 L415,512" class="flow"/>
  <path d="M700,436 L520,540" class="flow"/>
  <text x="422" y="478" class="lbl">3306 TLS</text>
  <path d="M830,186 L876,150" class="flowb"/>
  <text x="826" y="160" class="lbl">logs</text>
  <path d="M800,380 L876,365" class="flowb"/>
  <text x="812" y="398" class="lbl">secret</text>
  <path d="M800,358 L852,292 L876,252" class="flowb"/>
  <text x="790" y="288" class="lbl">app code</text>
  <path d="M345,350 L345,268" class="flowb"/>
  <text x="352" y="290" class="lbl">updates</text>
</svg>
